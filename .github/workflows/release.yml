name: Build binary package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_body:
        description: 'Release 描述（可选）'
        required: false
        default: ''

# 创建 Release 需要写 contents
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # actions-rs 已归档且跑在 Node 16 上，换成 docker.yml 里已经在用的那个
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install OpenSSL (x86_64-unknown-linux-gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install cross
        if: matrix.os != 'windows-latest'
        run: cargo install cross

      - name: Add macOS target
        if: contains(matrix.target, 'apple-darwin')
        run: rustup target add ${{ matrix.target }}

      - name: Build (cross for Linux, cargo for others)
        if: matrix.os != 'windows-latest'
        run: |
          if [[ "${{ matrix.target }}" == *"linux-gnu"* ]]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --target ${{ matrix.target }}

      # - name: Build
      #   if: matrix.target != 'aarch64-unknown-linux-gnu'
      #   run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/quarkdrive-webdav* dist/
          cd dist
          tar czf ../quarkdrive-webdav-${{ matrix.target }}.tar.gz *

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/quarkdrive-webdav.exe" -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath "quarkdrive-webdav-${{ matrix.target }}.zip"

      # 六个矩阵任务都跑这一步：第一个创建 Release，其余的往上追加自己的产物
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          # 不写死就会取 github.ref，从分支手动触发时那不是 tag，Release 建不出来
          tag_name: ${{ github.ref_name }}
          files: |
            quarkdrive-webdav-${{ matrix.target }}.*
          body: ${{ github.event.inputs.release_body }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}