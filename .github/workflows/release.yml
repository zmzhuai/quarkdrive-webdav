name: Build binary package

# 由「发布 Release」触发，而不是 tag 推送：Release 的标题和正文由发布者决定，
# 这个 workflow 只负责把六个平台的产物挂上去。
on:
  release:
    types: [published]
  workflow_dispatch:

# 往 Release 上传产物需要写 contents
permissions:
  contents: write

jobs:
  # 发布前的闸门。放在 CI 而不是本地脚本里，是因为发布可以从任何地方发起
  # —— 网页上点一次「Publish release」也算，那时候本地什么都不会执行。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # tag 决定对外的版本号，Cargo.toml 决定 --version 打印什么。
      # 两者不一致就是发布了一个会报错版本的二进制。
      - name: 校验 tag 与 Cargo.toml 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          crate="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag 是 $tag，Cargo.toml 里是 $crate。先提交版本号改动，再打 tag。"
            exit 1
          fi

      - run: cargo test

  build:
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # actions-rs 已归档且跑在 Node 16 上，换成 docker.yml 里已经在用的那个
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install OpenSSL (x86_64-unknown-linux-gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install cross
        if: matrix.os != 'windows-latest'
        run: cargo install cross

      - name: Add macOS target
        if: contains(matrix.target, 'apple-darwin')
        run: rustup target add ${{ matrix.target }}

      - name: Build (cross for Linux, cargo for others)
        if: matrix.os != 'windows-latest'
        run: |
          if [[ "${{ matrix.target }}" == *"linux-gnu"* ]]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --target ${{ matrix.target }}

      # - name: Build
      #   if: matrix.target != 'aarch64-unknown-linux-gnu'
      #   run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/quarkdrive-webdav* dist/
          cd dist
          tar czf ../quarkdrive-webdav-${{ matrix.target }}.tar.gz *

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/quarkdrive-webdav.exe" -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath "quarkdrive-webdav-${{ matrix.target }}.zip"

      # 六个矩阵任务都会跑这一步，所以这里只能挂产物，不能碰正文 ——
      # 带上 body 或 generate_release_notes 的话，正文会被追加六遍。
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          # 不写死就会取 github.ref，从分支手动触发时那不是 tag，Release 建不出来
          tag_name: ${{ github.ref_name }}
          files: |
            quarkdrive-webdav-${{ matrix.target }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}